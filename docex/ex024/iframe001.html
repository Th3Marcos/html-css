<!DOCTYPE html>
<html lang="pt-BR">
<style>
    iframe {
        width: 400px;
        height: 200px;
    }
</style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento Iframe</title>
</head>

<body>
    <h1>Testando o uso de um Iframe</h1>
    <p>Acessando o site do <iframe src="https://www.cursoemvideo.com" frameborder="0">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
        </iframe> para aprender a
        programar.
    </p>

    <p>O site do <iframe src="https://www.google.com" frameborder="0">
            <a href="https://www.google.com" target="_blank">Google</a>
        </iframe> também é muito bom para pesquisas. Note
        que ele bloqueia seu uso como iframe.</p>
    </p>

    <p>O site da <iframe src="https://www.radioliberdade.com.br" frameborder="0" scrolling="yes">
            <a href="https://www.radioliberdade.com.br" target="_blank">Rádio Liberdade</a>
        </iframe> é um teste de site de rádio.
    </p>

</body>

</html>
