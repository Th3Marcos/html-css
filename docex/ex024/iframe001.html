<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento Iframe</title>
    <style>
        /* Adicionando estilo para o iframe */
        iframe {
            border-radius: 10px;
            border: 1px solid #000;
        }
    </style>
</head>

<body>
    <h1>Testando o uso de um Iframe</h1>
    <p>Acessando o site do <iframe src="https://www.cursoemvideo.com" frameborder="0"></iframe> para aprender a
        programar.
    </p>

    <p>O site do <iframe src="https://www.google.com" frameborder="0"></iframe>também é muito bom para pesquisas. Note
        que ele bloqueia seu uso como iframe.</p>
    </p>

    <p>O site da <iframe src="https://www.radioliberdade.com.br" frameborder="0"></iframe> é um teste de site de rádio.
    </p>

</body>

</html>
